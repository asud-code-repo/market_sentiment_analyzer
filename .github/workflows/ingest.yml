name: Daily ingestion + classification

on:
  schedule:
    # Two runs a day, US Eastern:
    # - 6pm Monday-Friday (added 2026-11-16): the run the daily crash check
    #   reads. By then VIX, the S&P (Yahoo, completed sessions) and the
    #   Treasury curve have posted TODAY's close; a morning run only ever sees
    #   the previous day's (on 2026-11-16 the 10am run read VIX 19.3, the
    #   close was 22.9 = AMBER). The HY spread still lags a day (ICE posts the
    #   next morning). The scheduled check (a local Task Scheduler job
    #   running Claude Code at 6:30pm) waits for this run's crash_checks row before
    #   starting, so GitHub's cron delays (up to 62 minutes seen 2026-07-14)
    #   can't make it read the morning data.
    # - 10am Monday-Saturday: picks up what posts in the morning (HY spread,
    #   FRED's own values for the prior day, 8:30am releases) so the dashboard
    #   and any daytime check are current. Both runs write the same
    #   (series, date) keys, so the evening run overwrites, never duplicates.
    # get_indicator_panel's data_freshness check is the backstop for a
    # missed run either way. GitHub Actions cron is fixed UTC
    # and doesn't auto-adjust for daylight saving, so each run is split into
    # two entries — one per UTC offset — rather than a single year-round
    # expression. Only one entry per run ever matches on a given day since
    # the month ranges don't overlap.
    #
    # Approximated by calendar month, not the exact DST transition date
    # (2nd Sunday of March / 1st Sunday of November) — accurate to within
    # ~1-2 weeks around those two boundaries, off by exactly 1 hour during
    # that window. Fine for the morning run (it reads yesterday's close
    # either way); the evening run's caveat is noted beside its entries.
    #
    # Saturday 10am added 2026-11-14 so a Saturday check saw Friday's close.
    # The Friday 6pm run now already has it, but the Saturday run stays:
    # mcp_server/src/lib/freshness.ts expects an ingest dated Saturday on a
    # Saturday. Sunday is skipped (no Saturday session). Confirmation
    # streaks count distinct observation dates, so extra runs can't
    # double-count.
    - cron: "0 14 * 3-10 1-6"    # Mar-Oct (EDT, UTC-4) — 14:00 UTC = 10am EDT
    - cron: "0 15 * 11,12,1,2 1-6" # Nov-Feb (EST, UTC-5) — 15:00 UTC = 10am EST
    # Evening run, Mon-Fri. Same month approximation: in the ~2 weeks of March
    # before the switch to EDT it fires at 5pm EST (VIX/S&P still in; the
    # Treasury curve may not be), and in early November at 7pm EDT.
    - cron: "0 22 * 3-10 1-5"     # Mar-Oct (EDT) — 22:00 UTC = 6pm EDT
    - cron: "0 23 * 11,12,1,2 1-5" # Nov-Feb (EST) — 23:00 UTC = 6pm EST
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ingestion/package-lock.json

      - run: npm ci

      - run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          POLYMARKET_SLUGS: ${{ vars.POLYMARKET_SLUGS }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          SEC_EDGAR_CONTACT_EMAIL: ${{ secrets.SEC_EDGAR_CONTACT_EMAIL }}

  classify:
    needs: ingest # only runs if ingest's required sources (FRED, EIA) succeeded
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rule_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: rule_engine/package-lock.json

      - run: npm ci

      - run: npm run classify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
