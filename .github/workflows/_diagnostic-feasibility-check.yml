name: TEMP diagnostic - shares outstanding feasibility check

# One-off, not scheduled. Checks whether Massive's ticker-overview endpoint
# (free Stocks Basic tier) exposes a usable share_class_shares_outstanding
# field for ETFs, as a free proxy for creation/redemption flow (the paid
# ETF Global fund-flows add-on is $99/mo, out of scope). Deleted after use.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node check2.mjs
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
