name: TEMP diagnostic - dividend feasibility check

# One-off, not scheduled. Verifies whether Massive's /stocks/v1/dividends
# endpoint actually returns usable data for SPY/TLT on the real account
# before committing to a total-return calculation for the capital-rotation
# feature. Deleted after use — not meant to be a permanent workflow.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node check.mjs
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
